[project]
name = "mlx-embedding-server"
version = "0.1.0"
description = "Local MLX embedding server for xplorertui"
requires-python = ">=3.11"
dependencies = [
    "fastapi[standard]>=0.115.0",
    "mlx-embeddings @ git+https://github.com/Blaizzy/mlx-embeddings.git@v0.1.0",
    "mlx-lm==0.32.0",
    "mlx-optiq==0.0.4",
    "mlx-vlm>=0.4.4",
    "mlx>=0.31.0",
    "numpy>=1.26.0",
    "httpcore>=1.0.9,<2",
    "idna>=3.10",
    "pillow>=12.1.1",
    # Pin to a known-good pre-5.5 release until the upstream
    # `ReasoningEffort`/`mistral_common` loader regression is resolved for
    # Gemma 4 AutoProcessor paths.
    "transformers==5.17.0",
]

[dependency-groups]
# `uv run pytest` installs these. httpx2 is what starlette 1.x's TestClient
# expects; with plain httpx it warns that httpx support is deprecated.
dev = [
    "httpx2>=2.13",
    "pytest>=8",
    "pytest-asyncio>=1",
]

[tool.fastapi]
entrypoint = "server:app"

[tool.pytest.ini_options]
asyncio_default_fixture_loop_scope = "function"
